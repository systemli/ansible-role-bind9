---
- name: Assert that no removed master/slave variables are set
  ansible.builtin.assert:
    that:
      - bind9_masters is not defined
      - bind9_masters_extra is not defined
      - bind9_slaves is not defined
      - bind9_hidden_master is not defined
      - bind9_hidden_master_query_networks is not defined
      - bind9_zone_type not in ['master', 'slave']
    fail_msg: >-
      The variables bind9_masters, bind9_masters_extra, bind9_slaves,
      bind9_hidden_master and bind9_hidden_master_query_networks were renamed to
      bind9_primaries, bind9_primaries_extra, bind9_secondaries,
      bind9_hidden_primary and bind9_hidden_primary_query_networks. Zone types
      master/slave are now primary/secondary. See the README.
    quiet: true
  tags:
    - always

- name: Install bind9 packages
  ansible.builtin.apt:
    name: "{{ bind9_packages }}"
    state: present
    cache_valid_time: 600

- name: Setup logs
  when: bind9_named_logging
  block:
    - name: Ensure existence of the log directory
      ansible.builtin.file:
        path: "{{ bind9_log_path }}"
        state: directory
        owner: "{{ bind9_user }}"
        group: "{{ bind9_group }}"
        mode: "0755"

    - name: Configure log rotate for bind9
      ansible.builtin.template:
        src: "{{ bind9_templates | default('') }}logrotate.d/bind.j2"
        dest: /etc/logrotate.d/bind
        owner: root
        group: "{{ bind9_group }}"
        mode: "0644"

- name: Create bind9 directory for keys
  ansible.builtin.file:
    path: "{{ bind9_keydir }}"
    state: directory
    owner: "{{ bind9_user }}"
    group: "{{ bind9_group }}"
    mode: "02750"
  when: bind9_authoritative or bind9_generate_ddns_key | bool
  tags:
    - role:bind9:ddns
    - role:bind9:dnssec

- name: Create dynamic DNS keys
  ansible.builtin.include_tasks: create_ddns_keys.yml
  loop: "{{ bind9_zones_static + bind9_zones_dynamic }}"
  loop_control:
    label: "{{ item.name }}"
  when: bind9_generate_ddns_key | bool

- name: Configure bind9 named.conf files
  ansible.builtin.template:
    src: "{{ bind9_templates | default('') }}bind/{{ item }}.j2"
    dest: /etc/bind/{{ item }}
    owner: root
    group: "{{ bind9_group }}"
    mode: "0644"
  loop:
    - named.conf.local
    - named.conf.options
  loop_control:
    label: "{{ item }}"
  notify:
    - Reload bind9
  # Variable register for eventual use outside the role
  register: bind9_named_conf

- name: Check validity of named.conf
  ansible.builtin.command: named-checkconf
  register: bind9_reg_named_checkconf
  become: true
  become_user: "{{ bind9_user }}"
  changed_when: false
  check_mode: false
  vars:
    ansible_pipelining: true

- name: Create bind9 directory for primary zones
  ansible.builtin.file:
    path: "{{ bind9_zonedir }}"
    state: directory
    owner: root
    group: "{{ bind9_group }}"
    mode: "02775"
  when: bind9_authoritative

- name: Create bind9 directory for primary zone includes
  ansible.builtin.file:
    path: "{{ bind9_zonedir }}/includes"
    state: directory
    owner: root
    group: "{{ bind9_group }}"
    mode: "0755"
  when: bind9_authoritative

- name: Install bind9 authoritative include files
  ansible.builtin.template:
    src: "bind/zones/includes/{{ item }}.j2"
    dest: "{{ bind9_zonedir }}/includes/{{ item }}"
    owner: root
    group: "{{ bind9_group }}"
    mode: "0644"
  loop: "{{ bind9_authoritative_includes }}"
  loop_control:
    label: "{{ item }}"
  when: bind9_authoritative
  notify:
    - Zone file change
    - Reload bind9

- name: Install bind9 rndc key
  ansible.builtin.template:
    src: "{{ bind9_templates | default('') }}bind/rndc.key.j2"
    dest: /etc/bind/rndc.key
    owner: "{{ bind9_user }}"
    group: "{{ bind9_group }}"
    mode: "0640"
  when: bind9_rndc_key != ""
  notify:
    - Restart bind9
  tags:
    - role:bind9:rndc_key

# TODO: DDNS: move keys into vault file
- name: Copy over DDNS keys for zones with update_keyfile
  ansible.builtin.copy:
    src: bind/zones/{{ item.update_keyfile }}.key
    dest: "{{ bind9_keydir }}/{{ item.update_keyfile }}.key"
    owner: "{{ bind9_user }}"
    group: "{{ bind9_group }}"
    mode: "0644"
  loop: "{{ bind9_zones_static + bind9_zones_dynamic }}"
  loop_control:
    label: "{{ item.name }}"
  when:
    - bind9_authoritative
    - item.type | default(bind9_zone_type) == 'primary'
    - item.update_keyfile is defined and item.update_keyfile != ""

- name: Copy over DDNS private keys for zones with update_keyfile
  ansible.builtin.copy:
    src: bind/zones/{{ item.update_keyfile }}.private
    dest: "{{ bind9_keydir }}/{{ item.update_keyfile }}.private"
    owner: "{{ bind9_user }}"
    group: "{{ bind9_group }}"
    mode: "0600"
  loop: "{{ bind9_zones_static + bind9_zones_dynamic }}"
  loop_control:
    label: "{{ item.name }}"
  when:
    - bind9_authoritative
    - item.type | default(bind9_zone_type) == 'primary'
    - item.update_keyfile is defined and item.update_keyfile != ""

- name: Create dynamic bind9 zone files
  ansible.builtin.template:
    src: "{{ bind9_templates | default('') }}bind/zones/db.template.j2"
    dest: "{{ bind9_zonedir }}/db.{{ item.name }}"
    owner: root
    group: "{{ bind9_group }}"
    mode: "0644"
  loop: "{{ bind9_zones_dynamic }}"
  loop_control:
    label: "{{ item.name }}"
  when:
    - bind9_authoritative
    - item.type | default(bind9_zone_type) == 'primary'
  notify:
    - Zone file change
    - Reload bind9
  tags:
    - role:bind9:zones

- name: Install static bind9 zone files
  ansible.builtin.copy:
    src: bind/zones/db.{{ item.name }}
    dest: "{{ bind9_zonedir }}/db.{{ item.name }}"
    owner: root
    group: "{{ bind9_group }}"
    mode: "0644"
    force: "{{ item.force_update | default(true) }}"
  loop: "{{ bind9_zones_static }}"
  loop_control:
    label: "{{ item.name }}"
  when:
    - bind9_authoritative
    - item.type | default(bind9_zone_type) == 'primary'
  notify:
    - Zone file change
    - Reload bind9
  tags:
    - role:bind9:zones

- name: Check validity of zone files
  ansible.builtin.command:
    argv:
      - named-checkzone
      - "{{ item.name }}"
      - "{{ bind9_zonedir }}/db.{{ item.name }}"
  register: bind9_reg_named_checkzone
  become: true
  become_user: "{{ bind9_user }}"
  loop: "{{ bind9_zones_dynamic + bind9_zones_static }}"
  loop_control:
    label: "{{ item.name }}"
  when:
    - bind9_authoritative
    - item.type | default(bind9_zone_type) == 'primary'
  changed_when: false
  check_mode: false
  vars:
    ansible_pipelining: true

- name: Create named systemd override directory
  ansible.builtin.file:
    mode: "0755"
    path: /etc/systemd/system/named.service.d
    state: directory
  when:
    - bind9_zone_type == "primary" and (bind9_dnssec | bool or bind9_zones_dynamic | length > 0)

- name: Deploy named systemd override.conf to keep journals and zones in sync
  ansible.builtin.copy:
    dest: /etc/systemd/system/named.service.d/override.conf
    mode: "0644"
    src: systemd/override.conf
  notify:
    - Reload systemd
    - Restart bind9
  when:
    - bind9_zone_type == "primary" and (bind9_dnssec | bool or bind9_zones_dynamic | length > 0)
