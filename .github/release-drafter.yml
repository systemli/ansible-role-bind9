---
name-template: '$RESOLVED_VERSION'
tag-template: '$RESOLVED_VERSION'
categories:
  - title: '💥 Breaking Changes'
    labels:
      - 'breaking'
  - title: '🚀 Features'
    labels:
      - 'enhancement'
  - title: '🐛 Bug Fixes'
    labels:
      - 'bug'
  - title: '🧹 Maintenance'
    labels:
      - 'chore'
      - 'dependencies'
      - 'github_actions'
version-resolver:
  major:
    labels:
      - 'breaking'
  minor:
    labels:
      - 'enhancement'
  patch:
    labels:
      - 'bug'
      - 'chore'
      - 'dependencies'
      - 'github_actions'
  default: patch
# Labels are derived from conventional commit style PR titles
autolabeler:
  - label: 'breaking'
    title:
      - '/^\w+(\(.+\))?!:/'
  - label: 'enhancement'
    title:
      - '/^feat(\(.+\))?!?:/'
  - label: 'bug'
    title:
      - '/^fix(\(.+\))?!?:/'
  - label: 'chore'
    title:
      - '/^(chore|refactor|ci|docs|build|test|style|perf)(\(.+\))?!?:/'
template: |
  ## Changes

  $CHANGES

  **Full Changelog**: https://github.com/$OWNER/$REPOSITORY/compare/$PREVIOUS_TAG...$RESOLVED_VERSION
