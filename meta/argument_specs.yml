---
argument_specs:
  main:
    short_description: Install and maintain the Bind9 nameserver on Debian
    description:
      - After the role ran, the registered variables C(bind9_named_conf),
        C(bind9_reg_named_checkconf) and C(bind9_reg_named_checkzone) are
        available for use outside of the role.
    options:
      bind9_user:
        type: str
      bind9_group:
        type: str
      bind9_recursor:
        type: bool
      bind9_authoritative:
        type: bool
      bind9_forward:
        type: bool
      bind9_forward_servers:
        type: list
        elements: str
      bind9_dnssec:
        type: bool
      bind9_qname_minimization:
        type: str
      bind9_dnssec_validation:
        type: str
      bind9_hidden_primary:
        type: bool
      bind9_hidden_primary_query_networks:
        type: list
        elements: str
      bind9_notify_explicit:
        type: bool
      bind9_zone_type:
        type: str
      bind9_our_networks:
        type: list
        elements: str
      bind9_our_neighbors:
        type: list
        elements: str
      bind9_rndc_algorithm:
        type: str
      bind9_rndc_key:
        type: str
      bind9_primaries:
        type: list
        elements: dict
      bind9_primaries_extra:
        type: list
        elements: dict
      bind9_secondaries:
        type: list
        elements: str
      bind9_statistics_enabled:
        type: bool
      bind9_zones_dynamic:
        type: list
        elements: dict
      bind9_zones_static:
        type: list
        elements: dict
      bind9_authoritative_includes:
        type: list
        elements: str
      bind9_dnssec_zones_default_enabled:
        type: bool
      bind9_dnssec_policies:
        type: list
        elements: dict
      bind9_packages:
        type: list
        elements: str
      bind9_templates:
        type: str
      bind9_named_logging:
        type: bool
      bind9_log_path:
        type: str
      bind9_log_severity:
        type: str
      bind9_log_versions:
        type: int
      bind9_log_size:
        type: str
      bind9_log_categories:
        type: list
        elements: dict
      bind9_generate_ddns_key:
        type: bool
      bind9_zonedir:
        type: path
      bind9_keydir:
        type: path
      bind9_local_keydir:
        type: path
      bind9_rate_limit:
        type: dict
