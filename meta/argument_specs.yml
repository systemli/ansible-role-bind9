---
argument_specs:
  main:
    short_description: Install and maintain the Bind9 nameserver on Debian
    description:
      - After the role ran, the registered variables C(bind9_named_conf),
        C(bind9_reg_named_checkconf) and C(bind9_reg_named_checkzone) are
        available for use outside of the role.
    options:
      bind9_user:
        type: str
        default: bind
      bind9_group:
        type: str
        default: bind
      bind9_recursor:
        type: bool
        default: false
      bind9_authoritative:
        type: bool
        default: false
      bind9_forward:
        type: bool
        default: false
      bind9_forward_servers:
        type: list
        elements: str
        default: []
      bind9_dnssec:
        type: bool
        default: false
      bind9_qname_minimization:
        type: str
        default: relaxed
      bind9_dnssec_validation:
        type: str
        default: auto
      bind9_hidden_primary:
        type: bool
        default: false
      bind9_hidden_primary_query_networks:
        type: list
        elements: str
        default: []
      bind9_notify_explicit:
        type: bool
        default: false
      bind9_zone_type:
        type: str
        default: primary
      bind9_our_networks:
        type: list
        elements: str
        default: [localhost, localnets]
      bind9_our_neighbors:
        type: list
        elements: str
        default: [localhost, localnets]
      bind9_rndc_algorithm:
        type: str
        default: hmac-md5
      bind9_rndc_key:
        type: str
        default: ""
      bind9_primaries:
        type: list
        elements: dict
        default: []
      bind9_primaries_extra:
        type: list
        elements: dict
        default: []
      bind9_secondaries:
        type: list
        elements: str
        default: []
      bind9_statistics_enabled:
        type: bool
        default: false
      bind9_zones_dynamic:
        type: list
        elements: dict
        default: []
      bind9_zones_static:
        type: list
        elements: dict
        default: []
      bind9_authoritative_includes:
        type: list
        elements: str
        default: []
      bind9_dnssec_zones_default_enabled:
        type: bool
        default: true
      bind9_dnssec_policies:
        type: list
        elements: dict
        default: []
      bind9_packages:
        type: list
        elements: str
        default: [bind9, dnsutils]
      bind9_templates:
        type: str
        default: ""
      bind9_named_logging:
        type: bool
        default: false
      bind9_log_path:
        type: str
        default: /var/log/bind
      bind9_log_severity:
        type: str
        default: warning
      bind9_log_versions:
        type: int
        default: 3
      bind9_log_size:
        type: str
        default: 60m
      bind9_log_categories:
        type: list
        elements: dict
        default:
          - {name: default, destination: bind_log}
          - {name: update, destination: bind_log}
          - {name: update-security, destination: bind_log}
          - {name: security, destination: default_syslog}
          - {name: queries, destination: bind_log}
          - {name: lame-servers, destination: "null"}
      bind9_generate_ddns_key:
        type: bool
        default: true
      bind9_zonedir:
        type: path
        default: /etc/bind/zones
      bind9_keydir:
        type: path
        default: /etc/bind/keys
      bind9_local_keydir:
        type: path
        default: files/bind/zones
      bind9_rate_limit:
        type: dict
        default: {}
